name: Validate data and offline page
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python source/render_site.py
      - run: python source/test_people.py
      - run: python source/test_scores.py
      - run: python source/test_registration.py
      - run: python source/validate_release.py
